name: Validate BigQuery artifacts

on:
  pull_request:
    paths:
      - "tbl/**"
      - "sp/**"
      - "schemas/**"
      - "scripts/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - "tbl/**"
      - "sp/**"
      - "schemas/**"
      - "scripts/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate table and procedure files
        run: >-
          python scripts/bq_deploy.py validate
          --root .
          --report deployment-report.json

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bigquery-validation-report
          path: deployment-report.json
          if-no-files-found: ignore
          retention-days: 14
